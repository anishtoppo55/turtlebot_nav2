# Run the simulation with Gazebo and RViz windows on the host display.
#
#   xhost +local:root          # once per login: let the container use the display
#   docker compose up --build
#
# Pass launch options with LAUNCH_ARGS, e.g.
#   LAUNCH_ARGS="layout:=maze maze_seed:=3" docker compose up
#
# Open another shell in the running container with
#   docker compose exec sim bash

services:
  sim:
    build: .
    image: turtlebot3-adaptive-replanner:humble
    container_name: turtlebot3_sim
    # Host networking lets ROS 2 tools on the host see the container's topics
    # (use the same ROS_DOMAIN_ID on both sides).
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - TURTLEBOT3_MODEL=burger
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # GPU rendering for Intel/AMD graphics. Remove these two lines if the
    # host has no /dev/dri (rendering then falls back to software).
    devices:
      - /dev/dri:/dev/dri
    command: ros2 launch adaptive_path_replanner simulation.launch.py ${LAUNCH_ARGS:-}
