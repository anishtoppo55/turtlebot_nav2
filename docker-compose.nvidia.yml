# Extra settings for hosts with an NVIDIA GPU. Requires the NVIDIA Container
# Toolkit on the host. Use together with the main file:
#
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up

services:
  sim:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
